Which IP address range or IP address should you consider for this purpose?","192.0.2.0/24","198.51.100.0/24","10.0.0.0/8","224.0.0.0 through 239.255.255.255","192.88.99.0/24","","","C","The 10.0.0.0/8 IP address is part of the private IP address space, which is intended for use within private networks. This range is ideal for this scenario because it allows for internal communication between servers and devices without the risk of conflicting with public internet addresses or the attendees' private networks, assuming proper network segmentation and addressing are implemented.
192.0.2.0/24 is set aside for use in documentation and examples. While it won't conflict with public internet addresses, it's not intended for operational networks and provides a very limited address space.
198.51.100.0/24 is another range reserved for documentation and examples. Like 192.0.2.0/24, it's not suitable for operational use in a live network environment due to its limited scope and intended purpose.
224.0.0.0 through 239.255.255.255 is reserved for multicasting. This range is not suitable for your needs because it is intended for specific multicast applications, not general network segmentation for internal communication.
192.88.99.0/24 is set aside for a variety of special purposes, including facilitating the transition to IPv6. It is not intended for general use in private networks and does not suit the requirements for your network segment."
"ex6-q05","Networking Concepts","exam title in PDF","Exam Practice 1 (2nd set) Q5","single","1","What is the purpose of the 802.1Q standard in networking?","To define the operation of trunk ports in carrying multiple VLANs","To encrypt data traffic between VLANs for security","To specify the physical layer requirements for Ethernet cables","To establish a protocol for wireless network communication","","","","A","The 802.1Q standard defines VLAN tagging for Ethernet frames, allowing trunk ports to identify and manage traffic from multiple VLANs. This standard is crucial for VLAN implementation and inter-VLAN routing.
The 802.1Q standard does not deal with encryption; it focuses on VLAN tagging.
Physical layer specifications, such as those for Ethernet cables, are covered by other standards.
Wireless communication protocols are defined by other standards, such as 802.11."
"ex6-q06","Networking Concepts","exam title in PDF","Exam Practice 1 (2nd set) Q6","single","1","How does IPv6 anycast addressing differ from multicast addressing?","Anycast uses a single address for multiple interfaces globally.","Anycast allows a packet to be sent from multiple sources to a single interface.","Multicast sends a packet from a single source to a single interface.","Multicast uses a special range of addresses for routing protocols.","","","","A","The correct answer is that anycast uses a single address for multiple interfaces globally. Anycast allows packets to be delivered to the nearest (in terms of routing) interface with the given address, facilitating efficient routing and load balancing.
Anycast does not involve multiple sources; it's about delivering from one source to the nearest of multiple destinations.
Multicast is specifically for one-to-many communication, not one-to-one.
Multicast does use specific address ranges, but not for routing protocols; it's for group communication."
"ex6-q07","Networking Concepts","exam title in PDF","Exam Practice 1 (2nd set) Q7","single","1","What prefix do 6to4 addresses use?","64:ff9b::/96","2002::/16","3544::/16","6RD::/16","","","","B","6to4 automatic tunneling uses the prefix 2002::/16 for its addresses. This method allows IPv6 packets to be sent over an IPv4 network without any host configuration necessary to enable the tunnel.
64:ff9b::/96 is the prefix used by NAT64 for translating IPv6 addresses into IPv4 addresses.
3544 is not a prefix but the port number used by the Teredo protocol to tunnel IPv6 packets as IPv4-based UDP messages.
6RD::/16 is incorrect because 6RD is a protocol that replaces the 2002::/16 prefix used by 6to4 with an ISP-managed prefix for performance improvements, but it does not have a specific prefix format like ""6RD::/16""."
"ex6-q08","Networking Concepts","exam title in PDF","Exam Practice 1 (2nd set) Q8","single","1","A large enterprise is experiencing rapid growth and needs to expand its data center network to accommodate more servers and storage devices. The IT team is considering a network redesign to improve scalability and redundancy. They are particularly interested in a topology that can provide predictable network latency and eliminate loops without relying on traditional loop prevention protocols.
Which feature of the spine and leaf topology addresses the enterprise's need for predictable network latency and loop prevention?","The use of a central hub to connect all devices","Direct connections between all leaf switches","Each server only a single hop from the backbone","The implementation of DHCP for dynamic routing","","","","C","The spine and leaf topology ensures that each server (or device) is only ever a single hop from the backbone (spine switches), which makes network latency more predictable. This design, where each leaf switch is connected to every spine switch, allows for efficient and direct routing of traffic, improving performance and reducing the potential for bottlenecks.
The spine and leaf topology does not use a central hub to connect devices; instead, it relies on a structured arrangement of spine and leaf switches to facilitate direct and efficient connections.
Leaf switches in a spine and leaf topology do not have direct connections to each other. This design choice helps to prevent loops and ensures that all traffic is efficiently routed through the spine layer.
DHCP (Dynamic Host Configuration Protocol) is used for assigning IP addresses within networks and does not directly influence routing or the structural features of a network topology like spine and leaf."
"ex6-q09","Networking Concepts","exam title in PDF","Exam Practice 1 (2nd set) Q9","single","1","A network engineer is tasked with setting up a secure communication channel for their company's remote workers to access the corporate network. The company's requirements include the ability to authenticate users and devices, as well as encrypt data packets to ensure confidentiality and integrity.
Given these requirements, which tunneling protocol should the network engineer primarily consider implementing?","Point-to-Point Protocol (PPP)","Generic Routing Encapsulation (GRE)","Internet Protocol Security (IPSec)","Transport Layer Security (TLS)","","","","C","The correct answer is Internet Protocol Security (IPSec). IPSec operates at the Network layer of the OSI model and is specifically designed to authenticate hosts and encrypt packets, making it an ideal choice for creating secure VPN connections. It provides robust security features that meet the company's requirements for user and device authentication, as well as data confidentiality and integrity.
PPP lacks inherent security mechanisms such as encryption or authentication, making it unsuitable for the company's requirements on its own.
GRE can encapsulate a wide variety of network layer protocol types but lacks mechanisms for authenticating users or devices and does not provide encryption, making it insufficient for the company's security needs.
While TLS (and its datagram counterpart, DTLS) can provide secure communication, it operates at the Session layer and is typically used for securing data transmission over the Internet rather than creating VPNs. Its use would also introduce significant overhead due to the headers from the inner and outer packets."
"ex6-q10","Networking Concepts","exam title in PDF","Exam Practice 1 (2nd set) Q10","single","1","A network engineer is tasked with upgrading the data center's network infrastructure to support higher data rates. The current setup uses multimode fiber with LED-based transceivers. The engineer plans to switch to single mode fiber to extend the network's reach and increase bandwidth.
Which type of transceiver should the engineer select for compatibility with the new single mode fiber?","Fluorescent light-based transceiver","Laser diode-based transceiver","LED-based transceiver","Incandescent light-based transceiver","","","","B","For single mode fiber, laser diode-based transceivers are the appropriate choice because they provide the narrow beam and high power necessary for the long-distance, high-bandwidth capabilities of single mode fiber. This matches the engineer's goals of extending reach and increasing bandwidth.
LED-based transceivers are typically used with multimode fiber for shorter distances due to their broader light emission, making them unsuitable for the new single mode fiber setup.
Incandescent light-based transceivers are not used in fiber optic communications. This option is technically unfeasible.
Fluorescent light-based transceivers do not exist in the context of fiber optic communications. This option is not relevant to the technology."
"ex6-q11","Networking Concepts","exam title in PDF","Exam Practice 1 (2nd set) Q11","single","1","What is the role of a Fibre Channel switch in a SAN?","To act as a storage device for data","To provide interconnections between initiators and targets","To encrypt data transfers between devices","To assign logical unit numbers (LUNs) to storage devices","","","","B","A Fibre Channel switch's primary function in a Storage Area Network (SAN) is to facilitate communication between initiators (servers) and targets (storage devices) by providing the necessary interconnections. This enables data to be transferred efficiently across the network, allowing for high-speed access to storage resources.
Acting as a storage device for data is incorrect because the Fibre Channel switch facilitates communication rather than storing data itself.
Encrypting data transfers between devices is not the primary role of a Fibre Channel switch. While security is important in SANs, encryption is typically handled by other mechanisms or devices.
Assigning logical unit numbers (LUNs) to storage devices is a function related to storage management and configuration, not the role of a Fibre Channel switch. LUNs are used to identify specific volumes or resources within a storage device for access control and management."
"ex6-q12","Networking Concepts","exam title in PDF","Exam Practice 1 (2nd set) Q12","single","1","A small business owner wants to enhance the security of their company's network. They have a mix of incoming and outgoing traffic, including sensitive customer data transactions. The owner is considering implementing a firewall but is unsure which type would best suit their needs.
Which type of firewall should the small business owner implement to BEST protect sensitive customer data transactions?","Stateless Packet Filtering Firewall","Stateful Inspection Firewall","Application-Level Gateway","Circuit-Level Gateway","","","","B","A stateful inspection firewall is best suited for this scenario because it can maintain stateful information about network connections, including those involving sensitive customer data transactions. This allows it to intelligently allow or block traffic based on the state of the connection, providing a higher level of security.
Stateless Packet Filtering Firewall is incorrect because it treats each packet in isolation without considering the state of the connection, which might not provide sufficient security for sensitive data transactions.
Application-Level Gateway is incorrect because, while it provides high-level filtering capabilities, it might be too complex and resource-intensive for a small business's needs.
Circuit-Level Gateway is incorrect because it focuses on establishing a secure connection without inspecting the actual packets transmitted, which might not be sufficient for protecting sensitive transactions."
"ex6-q13","Networking Concepts","exam title in PDF","Exam Practice 1 (2nd set) Q13","single","1","A network administrator is redesigning a small office network that currently uses a single /24 subnet but wants to implement VLSM to optimize IP address usage.
The office has four departments with the following IP address needs: Admin (10 IP addresses), Development (40 IP addresses), Marketing (20 IP addresses), and Support (30 IP addresses).
What is the most efficient VLSM design that the administrator can implement?","/27 for Admin, /26 for Development, /27 for Marketing, and /26 for Support","/28 for Admin, /26 for Development, /27 for Marketing, and /26 for Support","/28 for Admin, /25 for Development, /27 for Marketing, and /26 for Support","/28 for Admin, /26 for Development, /28 for Marketing, and /27 for Support","","","","B","The correct answer is /28 for Admin, /26 for Development, /27 for Marketing, and /26 for Support. The Admin department needs 10 IP addresses, which can be accommodated by a /28 subnet (16 addresses). The Development department requires 40 IP addresses, fitting within a /26 subnet (64 addresses). The Marketing department's 20 IP addresses can be served by a /27 subnet (32 addresses), and the Support department's 30 IP addresses can also be accommodated by a /26 subnet (64 addresses), providing room for growth.
Allocating a /27 to Admin and Marketing does not efficiently use the available address space, given their requirements.
A /25 for Development allocates more addresses than necessary, reducing efficiency.
Allocating a /28 to Marketing does not provide enough IP addresses for their needs."
"ex6-q14","Networking Concepts","exam title in PDF","Exam Practice 1 (2nd set) Q14","single","1","During a network audit, an IT manager discovers that some legacy devices in their organization only support IPv4, while the majority of the infrastructure is dual stack capable. The manager wants to ensure seamless communication within the network and with external IPv6 resources.
What should the manager consider implementing to achieve this goal?","Convert all legacy devices to IPv6-only to force compatibility with dual stack infrastructure.","Use a tunneling mechanism for the legacy devices to communicate with external IPv6 resources.","Implement NAT64 for the entire network to translate between IPv4 and IPv6 addresses.","Do nothing, as dual stack devices automatically downgrade all communications to IPv4.","","","","B","The correct answer is to use a tunneling mechanism for the legacy devices to communicate with external IPv6 resources. For legacy devices that only support IPv4, using a tunneling mechanism allows IPv6 packets to be encapsulated within IPv4 packets. This enables these devices to communicate with external IPv6 resources without requiring a direct upgrade to IPv6 support on the devices themselves.
Converting all legacy devices to IPv6-only may not be possible due to hardware limitations or could be cost-prohibitive. It also doesn't directly address the compatibility with dual stack infrastructure.
Implementing NAT64 for the entire network is not necessary when the majority of the infrastructure is already dual stack capable. NAT64 is more suited for scenarios where IPv6-only networks need to communicate with IPv4 resources, not the other way around.
Dual stack devices do not automatically downgrade all communications to IPv4. Dual stack devices can communicate using either IPv4 or IPv6, depending on the destination's address availability and the network configuration."
"ex6-q15","Networking Concepts","exam title in PDF","Exam Practice 1 (2nd set) Q15","single","1","A small startup company has set up its initial office network using a hub to connect all employee computers. As the company grows, the network administrator notices an increase in network collisions and a decrease in overall network performance, especially during peak hours. The administrator is considering network infrastructure upgrades to address these issues.
Which of the following actions would most effectively reduce network collisions and improve performance in the company's network?","Replace the hub with a switch.","Add another hub to distribute the network load.","Increase the length of Ethernet cables to reduce signal strength.","Implement a wireless access point in place of the hub.","","","","A","The correct answer is to replace the hub with a switch. Switches create separate collision domains for each connected device, which significantly reduces collisions and improves network performance compared to hubs, which place all connected devices in the same collision domain.
Adding another hub would only extend the existing collision domain, potentially increasing the number of collisions and further degrading network performance.
Increasing the length of Ethernet cables does not address the issue of collisions; it could potentially introduce signal degradation and further reduce network performance.
While implementing a wireless access point might reduce physical cable clutter, it does not inherently solve the problem of collisions in the same way that replacing a hub with a switch does. Wireless networks have their own set of performance issues, such as interference and signal strength problems."
"ex6-q17","Networking Concepts","exam title in PDF","Exam Practice 1 (2nd set) Q17","single","1","What is the primary purpose of the TCP three-way handshake?","To terminate a TCP connection","To establish a TCP connection","To reset a TCP connection","To encrypt TCP packets","","","","B","The TCP three-way handshake is crucial for establishing a TCP connection between a client and a server, ensuring that both parties are ready to send and receive data. This process involves the exchange of SYN and ACK flags to synchronize and acknowledge the connection.
Terminating a TCP connection involves a different process, specifically the four-step TCP connection teardown process, not the three-way handshake.
Resetting a TCP connection is done using the RST flag, which is not part of the three-way handshake process.
Encrypting TCP packets is related to security protocols such as TLS/SSL, not the TCP three-way handshake itself."
"ex6-q18","Networking Concepts","exam title in PDF","Exam Practice 1 (2nd set) Q18","single","1","When do hosts on an IPv4 network forward packets to the default gateway?","When the destination IP address is within the same subnet","When the destination IP address is the host's own IP address","When the destination IP address is on a different IP network or subnet","When the destination IP address is the broadcast address","","","","C","Hosts use the default gateway to forward packets when the destination address is outside their local subnet, indicating that the packet needs to be routed through another network to reach its destination.
If the destination is within the same subnet, the packet is delivered directly to the destination host without needing to go through a gateway.
A host processes packets addressed to its own IP address internally and does not forward them to a gateway.
Broadcast messages are intended for all devices within the local network and are not forwarded outside the network."
"ex6-q19","Networking Concepts","exam title in PDF","Exam Practice 1 (2nd set) Q19","single","1","You manage a network with two locations (Portland and Seattle). Both locations are connected to the Internet.
The computers in both locations are configured to use IPv6. You'd like to implement an IPv6 solution to meet the following requirements:
Hosts in each location should be able to use IPv6 to communicate with hosts in the other location through the IPv4 internet.
You want to use a site-to-site tunneling method instead of a host-to-host tunneling method.
Which IPv6 solution should you use?","ISATAP","Teredo tunneling","6to4 tunneling","4to6 tunneling","","","","C","Use 6to4 tunneling to create a router-to-router tunnel between two sites through an IPv4 network.
Use Intra-Site Automatic Tunnel Addressing Protocol (ISATAP) to enable IPv6 hosts to communicate over a private IPv4 network within a site. ISATAP doesn't work between sites.
Use Teredo tunneling to configure a host-to-host tunnel between two hosts separated by symmetric NAT.
Use 4to6 tunneling to allow IPv4 traffic on an IPv6 network."
"ex6-q20","Networking Concepts","exam title in PDF","Exam Practice 1 (2nd set) Q20","single","1","A network administrator is working on enhancing the privacy of devices on the company network. The administrator decides to implement a feature that uses pseudorandom numbers for the interface ID part of the IPv6 address.
What feature is the network administrator implementing?","MAC-derived addressing","EUI-64 addressing","Privacy extensions","Hierarchical addressing","","","","C","The correct answer is privacy extensions. By using pseudorandom numbers for the interface ID, the network administrator is implementing privacy extensions for IPv6 addresses. This approach is used to enhance privacy and security by making it difficult to track devices based on their IPv6 addresses.
MAC-derived addressing uses the device's MAC address to form the interface ID, which is different from using pseudorandom numbers.
EUI-64 addressing also involves the MAC address and includes inserting ""fffe"" in the middle, not pseudorandom numbers.
Hierarchical addressing refers to the allocation of IPv6 addresses in a structured manner and is not related to the use of pseudorandom numbers for privacy."
"ex7-q04","Network Implementations","exam title in PDF","Exam Practice 2 (2nd set) Q4","single","1","A project manager is putting together supplies for a project using fiber optic cabling. The manager is looking at the cabling core ferrule, which has the tightest connection and best return loss performance.
Which of the following should the project manager use?","APC","UPC","PC","LC","","","","A","The angled faces of Angled Physical Contacts (APCs) make for an even tighter connection and better return loss performance. APCs cannot mix with PC faces or UPCs.
UltraPhysical Contact (UPC) means the cable and connector are polished to a higher standard than with PC.
Physical Contact (PC) faces of the connector and fiber tip are polished so that they curve slightly and fit together better, reducing return loss (interference caused by light reflecting back down the fiber).
The Local Connector (LC) is a small-form-factor connector with a tabbed push/pull design. LC is similar to SC, but the smaller size allows for higher port density. LC is a widely adopted form factor for Gigabit Ethernet and 10/40 GbE."
"ex7-q05","Network Implementations","exam title in PDF","Exam Practice 2 (2nd set) Q5","single","1","You manage a small cafe with a Wi-Fi network that still uses WEP encryption. You have noticed an increase in tech-savvy customers and want to upgrade your Wi-Fi security to prevent unauthorized access and data interception.
Which encryption standard should you upgrade to for the best security?","Stay with WEP","Upgrade to WPA","Upgrade to WPA2","Upgrade to WPA3","","","","D","The correct answer is to upgrade to WPA3. WPA3 is the latest and most secure Wi-Fi encryption standard, offering advanced security features such as SAE, improved encryption protocols, and protection against common attacks.
Staying with WEP is not advisable due to its known vulnerabilities and weak encryption.
Upgrading to WPA would be an improvement over WEP but still falls short of the security provided by WPA2 and WPA3.
Upgrading to WPA2 would also be an improvement, but WPA3 offers the best security features available."
"ex7-q06","Network Implementations","exam title in PDF","Exam Practice 2 (2nd set) Q6","single","1","During peak hours, a coffee shop experiences slow Wi-Fi speeds due to the high number of customers connecting to the Internet. The coffee shop's network consists of dual-band access points that support band steering.
The network administrator wants to improve the Wi-Fi experience for customers by optimizing the network's performance.
What action should the administrator take?","Disable band steering to allow devices to choose their preferred band.","Enable band steering to encourage devices to connect to the 5 GHz band.","Force all devices to connect only to the 2.4 GHz band to reduce complexity.","Replace all dual-band APs with single-band APs that only support the 2.4 GHz band.","","","","B","The correct answer is to enable band steering to encourage devices to connect to the 5 GHz band. Enabling band steering on dual-band access points helps optimize network performance by encouraging devices to connect to the less congested and faster 5 GHz band. This approach can significantly improve Wi-Fi speeds during peak hours by reducing congestion in the 2.4 GHz band, which is more prone to interference and has lower data rates compared to the 5 GHz band.
Disabling band steering to allow devices to choose their preferred band could lead to more devices choosing the congested 2.4 GHz band, worsening the network's performance during peak hours.
Forcing all devices to connect only to the 2.4 GHz band to reduce complexity would significantly increase congestion and interference in the 2.4 GHz band, leading to poorer Wi-Fi performance.
Replacing all dual-band APs with single-band APs that only support the 2.4 GHz band would eliminate the option for devices to connect to the faster and less congested 5 GHz band, reducing overall network performance."
"ex7-q07","Network Implementations","exam title in PDF","Exam Practice 2 (2nd set) Q7","single","1","A network architect is designing a new data center for a rapidly growing tech company. The design includes servers that will handle large volumes of data transactions. To ensure high availability and bandwidth, the architect plans to implement NIC teaming on all servers.
Each server is equipped with four 10 Gbps NICs. The company's network infrastructure includes high-capacity switches that support both static link aggregation and LACP.
Which NIC teaming configuration should the architect recommend to maximize both bandwidth and redundancy?","Configure the NICs on each server in a static link aggregation group without LACP.","Configure two NICs in active mode and two NICs in standby mode for each server.","Configure all four NICs on each server in LACP active mode.","Configure all four NICs on each server in LACP passive mode.","","","","C","Configuring all four NICs on each server in LACP active mode is the correct answer. This configuration ensures that the servers actively negotiate link aggregation with the switches, forming a Link Aggregation Group (LAG). This setup maximizes bandwidth by combining the capacity of all four NICs into a single logical link and provides redundancy because the LAG can continue to function even if one or more of the NICs fail, as long as at least one NIC remains operational.
While static link aggregation can increase bandwidth, it lacks the dynamic negotiation and configuration error recovery features of LACP, potentially leading to less optimal redundancy and more manual configuration effort.
Configuring two NICs in active mode and two NICs in standby mode for each server provides redundancy but does not maximize bandwidth because only half of the available NICs contribute to the bandwidth at any given time. The standby NICs are only used if one of the active NICs fails.
Configuring all NICs in passive mode would require the switch to be in active mode to initiate LACP negotiation. This could lead to issues if the switch is also set to passive or if there is any misconfiguration, potentially resulting in the LAG not forming correctly."
"ex7-q08","Network Implementations","exam title in PDF","Exam Practice 2 (2nd set) Q8","single","1","You are the safety officer in a large office building equipped with various fire suppression systems. During a routine inspection, you notice that one of the areas, which houses the server room filled with electrical equipment, does not have an appropriate fire suppression system installed.
Considering the risk of electric shock and the need to protect sensitive equipment, which fire suppression system would you recommend installing?","Wet-pipe sprinkler system","Dry-pipe sprinkler system","Clean agent fire suppression system","Water mist system","","","","C","Clean agent fire suppression system is the correct answer. Clean agent fire suppression systems are ideal for environments with sensitive electronic equipment, like server rooms, because they extinguish fires without causing damage to the equipment, do not conduct electricity, and leave no residue.
Wet-pipe sprinkler system is incorrect for a server room because the water could damage the electrical equipment.
Dry-pipe sprinkler system is incorrect for a server room because, although it reduces the risk of water damage compared to wet-pipe systems, it still uses water to extinguish fires, which can harm electronic equipment.
Water mist system is incorrect because, despite being less damaging than traditional water sprinklers, it still poses a risk to electronic equipment due to moisture."
"ex7-q09","Network Implementations","exam title in PDF","Exam Practice 2 (2nd set) Q9","single","1","A network administrator is setting up the protocol for identifying routes within an autonomous system.
Which of the following protocols is the network administrator using?","EGP","IGP","AS","RIP","","","","B","An Interior Gateway Protocol (IGP) identifies routes within an Autonomous System (AS). As well as the algorithm used to determine the network topology, routing protocols may be classified according to how they deal with administrative boundaries.
An Exterior Gateway Protocol (EGP) can advertise routes between autonomous systems. An EGP includes a field to communicate the network's autonomous system ID.
A network under the administrative control of a single owner is called an Autonomous System (AS).
The Routing Information Protocol (RIP) is a distance vector routing protocol. RIP only considers a single piece of information about the network topology."
"ex7-q10","Network Implementations","exam title in PDF","Exam Practice 2 (2nd set) Q10","single","1","A network engineer is analyzing the OSPF setup in a multi-area OSPF network for a large enterprise. The network consists of several departments, each configured as a separate OSPF area, and all connected through a central backbone area (Area 0).
The engineer notices that some of the departments are experiencing slow convergence times after a network change.
What could be the reason for the slow convergence times in these departments?","The areas experiencing slow convergence are not directly connected to Area 0.","OSPF hello packets are not being exchanged between routers within the affected areas.","The affected areas are using a flat routing system instead of a hierarchical OSPF structure.","Link State Advertisements (LSAs) are not being propagated efficiently within the affected areas.","","","","D","The correct answer is that Link State Advertisements (LSAs) are not being propagated efficiently within the affected areas. In OSPF, efficient propagation of LSAs is crucial for quick convergence. If LSAs are not being propagated efficiently within certain areas, it could lead to slow convergence times as routers take longer to build a complete and accurate picture of the network topology after a change.
All areas in an OSPF network must be connected to Area 0 for the network to function correctly. This connection issue would prevent routing altogether, not just slow convergence.
While the exchange of hello packets is necessary for establishing neighbor relationships, the scenario describes an issue with convergence after a network change, not initial neighbor establishment.
The scenario explicitly states that the network is configured with a hierarchical OSPF structure, not a flat routing system."
"ex7-q11","Network Implementations","exam title in PDF","Exam Practice 2 (2nd set) Q11","single","1","A systems administrator needs to combine multiple 1 Gbps connections to be able to support 2 Gbps connections.
What should the administrator set up?","CAM table","NIC teaming","Port security configuration","Auto-MDI/MDIX","","","","B","Port aggregation combines two or more separate cabled links into a single logical channel. From the host end, this is also known as NIC teaming.
A switch learns MAC addresses by reading the source address for a frame. The address mapping normally gets cached in a MAC address table that implements as content addressable memory (CAM).
A port security configuration validates the MAC address of end systems that connect to a switch port. In most scenarios, you would not expect the MAC address of servers and workstations to change often.
Auto-MDI/MDIX means that the switch senses the configuration of the connected device and cable wiring and ensures that a media dependent interface (MDI) uplink to an MDIX port gets configured."
"ex7-q12","Network Implementations","exam title in PDF","Exam Practice 2 (2nd set) Q12","single","1","A network engineer is configuring a new segment in their company's network. They need to ensure that packets destined for the Internet are correctly forwarded through the company's gateway router.
After setting up the configurations, they notice that only packets to local destinations are successfully delivered, while packets intended for the Internet are not.
What is the MOST likely configuration the engineer needs to verify or add?","Increase the TTL value on all outgoing packets.","Configure a default route pointing to the gateway router.","Enable ARP on all devices within the local network.","Decrease the hop count on the gateway router.","","","","B","The correct answer is to configure a default route pointing to the gateway router. For packets destined for the Internet or any external network, the router needs a default route (often referred to as the ""gateway of last resort"") that points to the gateway router. This ensures that packets with destinations not found in the routing table are forwarded to the gateway router for further routing to the Internet.
While TTL ensures packets do not circulate indefinitely, increasing TTL does not address the issue of packets not being forwarded to the Internet.
ARP is necessary for resolving IP addresses to MAC addresses within the same network segment but does not influence the forwarding of packets to external networks.
Decreasing the hop count would not facilitate the forwarding of packets to the Internet. The hop count is a property of packets, not routers, and is used to prevent packets from looping indefinitely."
"ex7-q13","Network Implementations","exam title in PDF","Exam Practice 2 (2nd set) Q13","single","1","The owner of a hotel has contracted with you to implement a wireless network to provide internet access for guests. The owner has asked that you implement security controls so that only paying guests are allowed to use the wireless network.
The owner wants guests to be presented with a login page when they initially connect to the wireless network. After entering a code provided by the concierge at check-in, guests should then be allowed full access to the Internet. If a user does not provide the correct code, he or she should not be allowed to access the Internet.
What should you do?","Implement a captive portal.","Implement MAC address filtering.","Implement 802.1x authentication using a RADIUS server.","Implement pre-shared key authentication.","","","","A","A captive portal would be the best choice in this scenario. A captive portal requires wireless network users to abide by certain conditions before they are allowed access to the wireless network. For example, the captive portal could require them to:
Agree to an Acceptable Use Policy Provide a PIN or password Pay for access to the wireless network View information or advertisements about the organization providing the wireless network (such as an airport or hotel)
When a wireless device initially connects to the wireless network, all traffic to or from that device is blocked until the user opens a browser and accesses the captive portal web page. After the user provides the appropriate code, traffic is unblocked, and the host can access the network normally.
MAC address filtering and 802.1x authentication would work from a technical standpoint, but these would be completely unmanageable in a hotel scenario where guests come and go every day. Using a pre-shared key would require a degree of technical expertise on the part of the hotel guests. It could also become problematic if the key were to be leaked, allowing non-guests to use the wireless network."
"ex7-q15","Network Implementations","exam title in PDF","Exam Practice 2 (2nd set) Q15","multi","3","What properties of a radio wave does modulation change to encode a signal? (Select three)","Speed","Direction","Phase","Temperature","Frequency","Amplitude","Color","C|E|F","The following are the properties of a radio wave that modulation changes to encode a signal:
Amplitude. Modulation can change the amplitude of a radio wave, which refers to the height of the wave's peaks and troughs. By altering the amplitude, information can be encoded into the wave, allowing for the transmission of data over wireless networks. Frequency. Frequency modulation involves changing the number of wave peaks per unit of time. This alteration in frequency is another method by which data is encoded into radio waves, enabling the transmission of information across wireless networks. Phase. Phase modulation changes the angle of the wave at a specific point in time. By adjusting the phase of radio waves, additional data can be encoded into the signal, contributing to the diversity of modulation techniques used in wireless communication.
The speed of a radio wave, which is essentially the speed of light, is a constant in a given medium and is not altered by modulation. Modulation focuses on changing properties like amplitude, frequency, and phase to encode data, not the speed of the wave.
Color is a property associated with visible light, not radio waves. Radio waves are part of the electromagnetic spectrum outside the visible range, so modulation does not involve changing colors.
Temperature does not directly affect the properties of a radio wave that are modulated to encode data. Modulation techniques involve changes to amplitude, frequency, and phase, rather than any thermal properties.
While the direction of a radio wave's propagation can be influenced by antenna design and orientation, modulation itself does not involve changing the direction of the wave. Modulation is concerned with encoding data by altering amplitude, frequency, and phase."
"ex7-q16","Network Implementations","exam title in PDF","Exam Practice 2 (2nd set) Q16","single","1","During a routine inspection of your company's server room, you notice that several racks are equipped with lockable front and rear doors, but many of these doors are left open during business hours. Additionally, some racks have unused slots that are not covered with blanking plates.
You are concerned that these practices may be affecting the server room's overall cooling efficiency.
What would be the most effective recommendation to address concerns over server performance?","Advise the IT staff to keep the lockable doors closed at all times to improve security.","Recommend the installation of blanking plates in all unused rack slots to improve airflow and cooling efficiency.","Suggest removing the lockable doors entirely to enhance airflow through the racks.","Propose the use of external fans to direct cooler air towards the open racks.","","","","B","Installing blanking plates in all unused rack slots is a straightforward and effective way to improve airflow and cooling efficiency within the server room and is the correct answer for this scenario. Blanking plates prevent the mixing of hot and cold air, ensuring that cool air is directed through active equipment and not wasted on empty spaces. This measure, combined with keeping the lockable doors closed, can significantly enhance cooling efficiency.
While keeping the lockable doors closed improves security, it does not directly address the issue of unused slots affecting cooling efficiency.
Removing the lockable doors entirely could compromise security and would not effectively address the issue of unused slots.
Using external fans to direct cooler air towards the racks is a less efficient solution compared to improving internal airflow management with blanking plates."
"ex7-q17","Network Implementations","exam title in PDF","Exam Practice 2 (2nd set) Q17","single","1","Which technology is usually used to bridge two office buildings wirelessly?","Wi-Fi Direct","Mesh networking","Highly directional antennas in bridge mode","Ad hoc networking","","","","C","To bridge two office buildings wirelessly, highly directional antennas, such as dish or Yagi antennas, are used. These antennas are aligned to point directly at each other and are connected to access points configured in bridge mode, facilitating the wireless link between the buildings.
Wi-Fi Direct is designed for direct device-to-device connections, not for bridging distant locations.
Mesh networking is used for creating scalable networks with multiple nodes, not specifically for point-to-point links.
Ad hoc networking involves peer-to-peer connections within a limited range, not suitable for bridging buildings."
"ex7-q18","Network Implementations","exam title in PDF","Exam Practice 2 (2nd set) Q18","single","1","What happens if both sides of a link aggregation are set to passive mode?","A bonded channel is created with reduced bandwidth.","A bonded channel is created with increased latency.","No bonded channel is created.","The physical links are disabled.","","","","C","When both sides of a link aggregation are set to passive mode, no bonded channel will be created because both sides are waiting for the other to initiate the LACP process. For a bonded channel to be established, at least one side must be in active mode.
When both sides are set to passive, no bonded channel is created at all, so there's no question of reduced bandwidth due to passive configuration.
Since no bonded channel is created when both sides are passive, there cannot be an increase in latency due to this specific configuration.
Setting both sides of a link aggregation to passive does not disable the physical links. The links remain active but are not aggregated because neither side initiates the LACP process."
"ex7-q19","Network Implementations","exam title in PDF","Exam Practice 2 (2nd set) Q19","single","1","What is the primary purpose of a dynamic routing protocol?","To statically assign IP addresses to devices on the network","To manually configure routing tables in each router","To use algorithms and metrics to build and maintain a routing information base","To decrease network security by sharing routing information","","","","C","Dynamic routing protocols automatically adjust to network changes by using algorithms and metrics to create and update a routing information base, which contains data about the network routes. This allows for efficient path selection and network communication.
Dynamic routing protocols do not deal with IP address assignment, which is typically handled by DHCP or static configuration.
Dynamic routing protocols automate the process of configuring routing tables, as opposed to manual configuration.
The purpose of dynamic routing protocols is to enhance network efficiency and adaptability, not to decrease security. While routing information is shared among routers, this is done to optimize routing decisions."
"ex7-q20","Network Implementations","exam title in PDF","Exam Practice 2 (2nd set) Q20","single","1","Why should access points with omnidirectional antennas ideally be ceiling-mounted?","To reduce signal strength","To focus the signal in a single direction","To minimize interference from furniture","To increase the frequency of the radio waves","","","","C","Ceiling-mounting access points with omnidirectional antennas helps minimize interference from obstructing furniture by allowing line-of-sight to most connecting devices, improving coverage and signal quality.
Ceiling-mounting is not done to reduce signal strength but to improve coverage.
Omnidirectional antennas do not focus the signal in a single direction; they distribute it equally in all directions.
The mounting position of the antenna does not affect the frequency of the radio waves."
"ex8-q04","Network Operations","exam title in PDF","Exam Practice 3 (2nd set) Q4","single","1","Which of the following is NOT a component of a fully redundant server configuration?","Multiple power supplies","Single network card","Redundant storage","Multiple cooling fans","","","","B","In a fully redundant server configuration, having a single network card would represent a single point of failure. Redundancy requires multiple components for each critical function, including networking, to ensure continuous operation.
Multiple power supplies are a part of a fully redundant configuration to prevent power failure from causing downtime.
Redundant storage, such as RAID arrays, is crucial for data availability and protection against drive failures.
Multiple cooling fans are included to ensure that the failure of a single fan does not lead to overheating and potential system failure."
"ex8-q06","Network Operations","exam title in PDF","Exam Practice 3 (2nd set) Q6","single","1","You are a network administrator for a large corporation. Recently, you've noticed that after a power outage, several network devices did not recover their previous configurations, leading to network instability and downtime.
Upon investigation, you discover that the running configurations were not saved as the startup configurations on these devices.
To prevent this issue from recurring, what should you implement?","Manual checks of each device's configuration after every change","A policy that requires all changes to be saved as both running and startup configurations","A complete network redesign to avoid using devices with separate running and startup configurations","A reliance on user reports to identify which devices fail to recover after a power outage","","","","B","The correct solution is to implement a policy that requires all changes to be saved as both running and startup configurations. Implementing a policy that mandates all configuration changes to be saved as both running and startup configurations ensures that devices can recover their configurations after a restart or power outage, thus preventing network instability and downtime.
Manual checks are not scalable or reliable for ensuring configurations are saved correctly across numerous devices.
A complete network redesign is an extreme and unnecessary measure for addressing the issue of configurations not being saved correctly.
Relying on user reports is reactive and can lead to unnecessary downtime; proactive measures are needed to ensure configurations are saved correctly."
"ex8-q07","Network Operations","exam title in PDF","Exam Practice 3 (2nd set) Q7","single","1","In an effort to enhance network security and performance, a company decides to deploy a system that can analyze traffic flows in real-time, generating alerts for unusual patterns that might indicate security threats or performance issues. The system should be able to aggregate flows from multiple sources and provide detailed reports.
What components are necessary for the company to implement this system?","NetFlow exporter and DHCP server","NetFlow collector and analyzer","DNS server and SNMP manager","SNMP agent and NetFlow exporter","","","","B","For a system that analyzes traffic flows in real-time, generating alerts for unusual patterns, the necessary components are a NetFlow collector and a NetFlow analyzer. The collector aggregates flows from multiple exporters, while the analyzer interprets the information, generating alerts and detailed reports. This setup is ideal for enhancing both security and performance through detailed traffic flow analysis.
While a NetFlow exporter is crucial for defining and caching flows, a DHCP server is unrelated to traffic flow analysis and would not fulfill the requirements of this scenario.
A DNS server translates domain names to IP addresses, and an SNMP manager manages network devices. Neither is specifically designed for analyzing traffic flows or generating security or performance alerts.
An SNMP agent collects data for the SNMP manager, and a NetFlow exporter defines and caches flows. However, without a NetFlow collector and analyzer, this setup lacks the capability to aggregate and analyze traffic flows comprehensively, missing the requirement for real-time analysis and alerting."
"ex8-q08","Network Operations","exam title in PDF","Exam Practice 3 (2nd set) Q8","multi","2","A network administrator is designing a set of Internet Protocol (IP) addresses for a Class C network in order to lease it out to clients when booting. A set of printers will require the same IP address upon renewing the lease.
Which of the following network components will support this design? (Select two.)","DHCPv6","IP reservation","Virtual IP","DHCP","","","","B|D","Dynamic Host Configuration Protocol (DHCP) provides an automatic method for allocating an IPv4 address, subnet mask, and default gateway.
IP reservation, or MAC reservation, is a mapping of the MAC address to a specific IP address within the DHCP server's pool. The same IP address will be given to the registered MAC address of the requesting client.
DHCPv6 is DHCP for IPv6 addresses. Although similar to DHCP, DHCPv6 uses the multicast address ff:02::1:2 to discover a DHCP server.
A virtual IP is a shared IP address for the purpose of representing, for example, a group of physical routers using a Hot Standby Router Protocol (HSRP) or multiple servers configured for load balancing."
"ex8-q09","Network Operations","exam title in PDF","Exam Practice 3 (2nd set) Q9","single","1","You are configuring a new web server for your company, which will host the company's main website. The server has an IPv4 address of 192.168.1.5. You want the website to be accessible through both www.company.com and company.com.
Which of the following DNS record configurations would BEST achieve this goal?","Create an A record for company.com pointing to 192.168.1.5 and a CNAME record for www.company.com aliasing company.com.","Create two A records, one for www.company.com and one for company.com, both pointing to 192.168.1.5.","Create a CNAME record for company.com aliasing www.company.com and an A record for www.company.com pointing to 192.168.1.5.","Create an AAAA record for company.com and a CNAME record for www.company.com aliasing company.com.","","","","A","The correct answer is to create an A record for company.com pointing to 192.168.1.5 and a CNAME record for www.company.com aliasing company.com. This configuration correctly maps the domain to its IP address using an A record and then uses a CNAME record to alias the www subdomain to the main domain, ensuring both URLs resolve to the same IP address.
While creating two A records, one for www.company.com and one for company.com, both pointing to 192.168.1.5 works, it is not as efficient as using a CNAME record for the www subdomain, which makes DNS administration easier.
Creating a CNAME record for company.com aliasing www.company.com and an A record for www.company.com pointing to 192.168.1.5 is incorrect because the primary domain should have the A record, and the subdomain (like www) should use the CNAME record for aliasing.
Creating an AAAA record for company.com and a CNAME record for www.company.com aliasing company.com is incorrect because an AAAA record is used for IPv6 addresses, not IPv4 addresses like 192.168.1.5."
"ex8-q10","Network Operations","exam title in PDF","Exam Practice 3 (2nd set) Q10","single","1","What is the purpose of using round robin DNS?","To increase DNS security","To decrease DNS lookup times","To distribute network traffic across multiple servers","To create a backup DNS server","","","","C","Round robin DNS is a technique used to distribute network traffic evenly across multiple servers by configuring multiple A or AAAA records with the same hostname but different IP addresses.
Round robin DNS is used for load balancing, not specifically for increasing security.
Round robin DNS does not necessarily decrease DNS lookup times; its primary purpose is load balancing.
Creating a backup DNS server is not the purpose of round robin DNS; it's about load distribution."
"ex8-q11","Network Operations","exam title in PDF","Exam Practice 3 (2nd set) Q11","single","1","How can DNS record updates be propagated more quickly?","By increasing the TTL value","By performing a zone transfer","By reducing the TTL value before the change","By using TCP port 53 instead of UDP port 53","","","","C","Reducing the TTL value before making a DNS record change is a strategic way to ensure that the change propagates more quickly across the Internet. A lower TTL means that cached records expire sooner, forcing DNS resolvers to query for fresh information more frequently, which helps in the faster propagation of the updated record.
Increasing the TTL value would have the opposite effect, causing DNS resolvers to cache records for longer periods and thus delaying the propagation of any changes made to those records.
Deleting the old DNS record immediately after an update does not directly affect the speed of propagation. The key to faster propagation is managing the TTL values effectively, not the immediate deletion of old records.
While keeping the TTL value low can ensure that changes propagate quickly, doing so indefinitely can increase the load on DNS servers and potentially degrade performance due to the frequent DNS queries. It's better to adjust TTL values strategically around planned changes."
"ex8-q12","Network Operations","exam title in PDF","Exam Practice 3 (2nd set) Q12","single","1","You are configuring the DNS settings for your company's new email server. To ensure that emails are correctly routed to this server, you need to update the DNS records.
Which type of DNS record should you create to identify the new email server for your domain?","A Record","MX Record","CNAME Record","TXT Record","","","","B","An MX (Mail Exchange) Record is specifically used to identify an email server for a domain. It ensures that emails sent to your domain are correctly routed to the designated email server. MX records can also specify multiple servers for redundancy and assign preference values to prioritize them.
An A Record maps a domain name to its corresponding IPv4 address. While it's essential for resolving domain names to IP addresses, it does not specify email servers for a domain.
A CNAME Record is used to alias one domain name to another. It's not suitable for identifying email servers because an MX record must not point to a CNAME record but rather to a domain with an A or AAAA record.
A TXT Record is used to store free-form text information in DNS, such as SPF and DKIM records for email authentication. While important for email security and verification, TXT records do not identify email servers."
"ex8-q14","Network Operations","exam title in PDF","Exam Practice 3 (2nd set) Q14","single","1","What does disaster recovery focus on?","Expanding the business to new markets","Switching services to failover systems or sites","Increasing the number of employees","Developing new products","","","","B","Disaster recovery is specifically concerned with actions such as switching to alternate systems or sites in the event of a disaster and restoring data and systems from backups to ensure continuity.
Expanding the business to new markets is not related to disaster recovery, which is focused on recovery and continuity in the face of disasters.
Increasing the number of employees is a business growth strategy, not related to disaster recovery.
Developing new products is unrelated to the immediate needs and focus of disaster recovery."
"ex8-q15","Network Operations","exam title in PDF","Exam Practice 3 (2nd set) Q15","single","1","You are concerned that an attacker can gain access to your web server, make modifications to the system, and alter the log files to hide his or her actions.
Which of the following actions would BEST protect the log files?","Use Syslog to send log entries to another server.","Encrypt the log files.","Configure permissions on the log files to prevent access.","Take a hash of the log files.","","","","A","The best protection is to save log files to a remote server. In this way, system compromise does not provide access to that system's log files.
Configuring permissions on the log files would allow access for only specified user accounts. However, if an attacker has gained access to the system, he or she might also have access to the user accounts that've been given access to the log files.
Encrypting the log files protects the contents from being read, but this does not prevent the files from being deleted.
Hashing the log files ensures their integrity and that they have not been altered since they were created."
"ex8-q16","Network Operations","exam title in PDF","Exam Practice 3 (2nd set) Q16","single","1","What is the main purpose of DNS over Transport Layer Security (DoT)?","To reduce the size of DNS responses","To increase the speed of DNS queries","To secure DNS queries against tampering","To anonymize DNS traffic","","","","C","The main purpose of DoT is to use TLS to secure DNS queries, ensuring that the DNS traffic is validated and encrypted, protecting against tampering by threat actors.
DoT does not focus on reducing the size of DNS responses.
DoT's main purpose is security, not necessarily increasing the speed of DNS queries.
DoT secures DNS traffic but does not anonymize it."
"ex8-q17","Network Operations","exam title in PDF","Exam Practice 3 (2nd set) Q17","multi","2","How are changes categorized? (Select two.)","By the department affected","By their potential impact","By their duration","By their level of risk","By their cost","","","B|D","Changes are categorized according to their potential impact and level of risk to help prioritize and manage them appropriately. This categorization ensures that higher-risk changes receive more scrutiny and that resources are allocated effectively.
Cost may be a consideration, but changes are primarily categorized by impact and risk.
Duration is a factor in planning but not the primary method of categorization for impact and risk.
The affected department is relevant but does not determine the categorization of changes by impact and risk."
"ex8-q18","Network Operations","exam title in PDF","Exam Practice 3 (2nd set) Q18","single","1","What is the disadvantage of an active-active cluster configuration during failover?","The system goes offline until the failed node is repaired.","There is no disadvantage; performance improves during failover.","Performance is degraded due to the increased workload.","The virtual IP is lost, requiring manual intervention.","","","","C","In an active-active configuration, both nodes are processing connections concurrently. If one node fails, the workload of the failed node is shifted to the remaining node(s), leading to increased workload on these nodes and potentially degraded performance.
The system does not go offline; the remaining nodes continue to handle the workload.
Performance does not improve during failover; it is likely to degrade due to the increased workload on the remaining nodes.
The virtual IP is not lost during failover; it continues to be used to access the service."
"ex8-q19","Network Operations","exam title in PDF","Exam Practice 3 (2nd set) Q19","single","1","What does a primary DNS server zone indicate?","The server holds a read-only copy of the zone.","The server can only cache DNS records.","The zone records held on the server are editable.","The server can only provide non-authoritative answers.","","","","C","A primary DNS server zone means that the zone records held on the server are editable, allowing for updates and changes.
A read-only copy of the zone is characteristic of a secondary DNS server.
Caching is a function of cache-only servers.
Providing non-authoritative answers is not exclusive to primary or secondary servers."
"ex8-q20","Network Operations","exam title in PDF","Exam Practice 3 (2nd set) Q20","single","1","Your organization has recently deployed a new public-facing web application hosted on the IP address 203.0.113.45. To ensure proper email delivery from this application and to support certain integrations that rely on reverse DNS lookups, you decide to configure a PTR record.
What would be the correct configuration for the PTR record in the reverse DNS zone?","Add a PTR record for 45.113.0.203.in-addr.arpa pointing to your domain.","Add a PTR record for 203.0.113.45.in-addr.arpa pointing to your domain.","Add an A record for 203.0.113.45 pointing to your domain.","Add a PTR record for your domain pointing to 203.0.113.45.","","","","A","The correct answer is to add a PTR record for 45.113.0.203.in-addr.arpa pointing to your domain. For reverse DNS lookups, the IP address is reversed and appended with "".in-addr.arpa"" for IPv4 addresses. This is the correct format for querying the PTR record associated with the IP address, which should point to your domain.
Adding a PTR record for 203.0.113.45.in-addr.arpa pointing to your domain incorrectly suggests using the direct IP address followed by in-addr.arpa, which is not the correct format for reverse DNS queries.
An A record maps a domain name to an IP address and is not used for reverse DNS lookups, which require a PTR record.
PTR records in reverse DNS zones should point from the reversed IP address format to the domain, not the other way around."
"ex9-q04","Network Security","exam title in PDF","Exam Practice 4 (2nd set) Q4","single","1","A network administrator notices unusual network traffic patterns and sporadic communication issues within the corporate network.
Upon closer inspection using network monitoring tools, the administrator observes multiple ARP reply packets being broadcasted across the network, all indicating the same MAC address for different IP addresses, including the default gateway.
What type of attack is most likely occurring?","DDoS Attack","ARP Spoofing","Phishing Attack","SQL Injection","","","","B","The scenario describes a situation where multiple ARP reply packets are being broadcasted, all associating different IP addresses with the same MAC address. This is indicative of ARP spoofing, where an attacker sends unsolicited ARP replies to associate their MAC address with the IP addresses of other hosts (including the default gateway) to intercept or redirect traffic.
A Distributed Denial of Service (DDoS) attack aims to overwhelm a target with excessive traffic, causing service disruption. The symptoms described in the scenario do not match those of a DDoS attack, which typically does not involve ARP spoofing.
Phishing attacks involve deceiving individuals into providing sensitive information through fraudulent communication, such as emails or websites. This scenario does not describe such activities but focuses on network traffic anomalies.
SQL Injection is a code injection technique used to attack data-driven applications by inserting malicious SQL statements into an entry field. The scenario described does not involve database interactions or code injections."
"ex9-q05","Network Security","exam title in PDF","Exam Practice 4 (2nd set) Q5","single","1","How does PAM help mitigate risks from weak configuration control over authorizations?","By providing unlimited access to all users","By managing credentials for access privileged accounts","By removing all access controls","By allowing users to self-manage their privileges","","","","B","PAM mitigates risks associated with weak configuration control by identifying, documenting, and managing privileged accounts and the credentials used to access them. This gives visibility into their use and helps secure access to critical systems.
Providing unlimited access would increase, not mitigate, security risks.
Removing access controls would eliminate any form of security over privileged accounts, increasing vulnerability.
Allowing users to self-manage their privileges could lead to excessive rights and security breaches."
"ex9-q06","Network Security","exam title in PDF","Exam Practice 4 (2nd set) Q6","single","1","On your way into the back entrance of your work building one morning, a man dressed as a plumber asks you to let him in so he can fix the restroom.
What should you do?","Let him in.","Let him in and help him find the restroom. Then let him work.","Direct him to the front entrance and instruct him to check in with the receptionist.","Tell him no and quickly close the door.","","","","C","You should direct him to the front entrance where he can check in with the proper authorities in your organization. Letting him in without knowing if he should be there could compromise security. Turning him away would be unprofessional."
"ex9-q07","Network Security","exam title in PDF","Exam Practice 4 (2nd set) Q7","single","1","What is the baseline in the context of a vulnerability assessment?","The highest level of security achievable","The minimum level of security required by law","The ideal configuration state of a system","The default settings of a software application","","","","C","In vulnerability assessments, the baseline refers to the ideal or desired state of system configurations against which the current state is compared. This baseline represents the standards or best practices for secure configuration, helping to identify deviations that may pose security risks.
While achieving the highest level of security is a goal, the baseline in a vulnerability assessment specifically refers to the standard or ideal configurations, not necessarily the absolute highest level of security possible.
The baseline may include legal requirements, but it encompasses a broader range of standards and best practices beyond just legal compliance. It represents an ideal state based on a comprehensive view of security.
Default settings of software applications often do not represent the ideal security configuration and may contain insecure options. The baseline in a vulnerability assessment is determined by security best practices, not by default settings."
"ex9-q08","Network Security","exam title in PDF","Exam Practice 4 (2nd set) Q8","single","1","You are tasked with enhancing the security of a large warehouse that stores valuable goods. The warehouse has multiple entry points and a large central storage area.
You need to choose a surveillance system that allows for both monitoring of entry points and the ability to identify individuals in the central storage area.
Which type of camera system would BEST meet these requirements?","Fixed cameras with narrow focal lengths at each entry point and PTZ cameras in the central storage area","PTZ cameras at each entry point and fixed cameras with narrow focal lengths in the central storage area","Fixed cameras with wide focal lengths at each entry point and in the central storage area","PTZ cameras at both the entry points and the central storage area","","","","A","The best solution is fixed cameras with narrow focal lengths at each entry point and PTZ cameras in the central storage area. Fixed cameras with narrow focal lengths are perfectly adequate for recording the image of every person entering through an access control vestibule, as they provide a clear, unchanging view of a specific area. PTZ cameras in the central storage area allow for the flexibility needed to survey a large room and pick out individual faces, making it possible to monitor the entire area effectively and zoom in on specific points of interest or individuals as needed.
PTZ cameras at each entry point might be overkill for monitoring entry points where a fixed view is sufficient, and fixed cameras in the central storage area would not provide the flexibility needed to monitor such a large space effectively.
Fixed cameras with wide focal lengths would not provide the detailed view needed to identify individuals at entry points or in the central storage area, making it difficult to monitor and secure the warehouse effectively.
While PTZ cameras at both the entry points and the central storage area would provide flexibility, it might not be the most cost-effective solution, and fixed cameras are more than adequate for monitoring entry points."
"ex9-q09","Network Security","exam title in PDF","Exam Practice 4 (2nd set) Q9","single","1","A network engineer wants to allow authorized users to be able to authenticate administrative access to routers and switches remotely.
Which protocol allows this type of access, uses reliable delivery, and makes it easy to detect when a server is down?","Terminal Access Controller Access Control System (TACACS+)","Directory services","Lightweight Directory Access Protocol (LDAP)","Remote Authentication Dial-in User Service (RADIUS)","","","","A","Terminal Access Controller Access Control System Plus (TACACS+) authenticates administrative access to routers and switches. TACACS+ uses TCP over port 49 and the reliable delivery offered by TCP makes it easier to detect when a server is down, and encrypts all the payload in packets.
Directory services is a network service that stores identity information about all the objects in a network, including users, groups, servers, client computers, and printers.
RADIUS (Remote Authentication Dial-in User Service) is often used in VPN implementations, and manages remote and wireless authentication infrastructures.
Lightweight Directory Access Protocol (LDAP) is a network protocol that accesses network directory databases, which store information about authorized users and their privileges, as well as other organizational information."
"ex9-q10","Network Security","exam title in PDF","Exam Practice 4 (2nd set) Q10","single","1","A network administrator is setting up a secure wireless network for their company. The administrator wants to ensure that only authorized employees can access the network and that the authentication process is secure and reliable.
The network administrator decides to implement an authentication method that can support multiple authentication protocols and technologies.
Which of the following methods should the administrator use?","WEP (Wired Equivalent Privacy)","EAP (Extensible Authentication Protocol)","WPA-Personal","MAC Address Filtering","","","","B","EAP is the best choice for the network administrator because it provides a framework for deploying multiple types of authentication protocols and technologies. This flexibility allows for a secure and reliable authentication process for users trying to access the wireless network. EAP is designed to authenticate endpoint devices before they can join the network, making it ideal for the administrator's requirements to ensure that only authorized employees can access the company's network.
WEP (Wired Equivalent Privacy) is an outdated and insecure method of securing wireless networks, known for its vulnerabilities and ease of being bypassed by attackers.
WPA-Personal is a security protocol designed for home and small office networks and may not offer the level of security and flexibility in authentication methods that a company network requires.
MAC Address Filtering controls access to a network by allowing or denying access to specific devices based on their MAC address. However, it does not provide the level of security and authentication flexibility that EAP offers, as MAC addresses can be spoofed by attackers."
"ex9-q11","Network Security","exam title in PDF","Exam Practice 4 (2nd set) Q11","single","1","What might users have to agree to as part of a BYOD policy?","Installing any app they wish without restrictions","Prohibiting the use of security patches","Permitting inspection of the device","Refusing to use enterprise mobility management suites","","","","C","As part of BYOD policies, users might have to agree to allow some level of inspection of their personal devices. This is to ensure that corporate data is protected and that the devices comply with security policies.
Users are typically required to follow certain restrictions on app installations to protect corporate data.
Encouraging the use of security patches is a part of BYOD policies, not prohibiting them.
Users are often required to use EMM suites as part of the security measures in a BYOD environment, not refuse them."
"ex9-q12","Network Security","exam title in PDF","Exam Practice 4 (2nd set) Q12","single","1","What is typosquatting in the context of DNS attacks?","Hijacking a DNS server to redirect traffic to malicious sites","Using false DNS requests to impersonate a legitimate DNS service","Registering domain names similar to legitimate ones to trick users","Manipulating cached DNS records to redirect users to rogue websites","","","","C","Typosquatting involves malicious actors registering domain names that closely resemble those of legitimate, well-known websites but contain minor typos or variations. This exploits the likelihood of users making typographical errors when entering URLs, directing them to potentially harmful sites instead of their intended destinations. This method relies on deception rather than technical manipulation of DNS services or records.
Hijacking a DNS server to redirect traffic to malicious sites involves taking control of a DNS server to alter DNS records, which is a different form of attack.
Using false DNS requests to impersonate a legitimate DNS service describes DNS spoofing, not typosquatting.
Manipulating cached DNS records to redirect users to rogue websites refers to DNS poisoning, not the registration of misleading domain names."
"ex9-q14","Network Security","exam title in PDF","Exam Practice 4 (2nd set) Q14","single","1","What makes an authentication technology considered strong?","Using a single authentication factor","Combining more than one type of authentication","Using a very complex password","Limiting access to a specific location","","","","B","Strong authentication involves the use of multiple factors, enhancing security by requiring more than one method of verification, making unauthorized access significantly more difficult.
Single-factor authentication is considered weaker because it relies on just one method of verification.
While complex passwords are recommended, they alone do not constitute strong authentication without additional factors.
Limiting access to a specific location can be part of a multifactor approach but on its own does not make the authentication strong."
"ex9-q15","Network Security","exam title in PDF","Exam Practice 4 (2nd set) Q15","single","1","Which of the following do asset tracking tags use to allow electronic surveillance of managed assets and help prevent theft of assets?","IR blaster","Infrared","Near Field Communications (NFC)","Radio Frequency Identification (RFID)","","","","D","Radio Frequency Identification (RFID) is a means of encoding information into passive tags, which can be easily attached to devices, structures, clothing, or almost anything else.
Near Field Communications (NFC) is mostly used for contactless payment readers, security ID tags, and shop shelf edge labels for stock control. It can be used to configure other types of connection such as pairing Bluetooth devices.
Infrared is used in smartphones, wearable technology, and Internet of Things (IoT) peripherals. Infrared is less common on modern peripherals and computer systems thanks to the growth of radio-based systems, such as Wi-Fi and Bluetooth.
An IR blaster allows the device to interact with an IR receiver and operate a device such as a TV or HVAC monitor like a remote-control handset."
"ex9-q16","Network Security","exam title in PDF","Exam Practice 4 (2nd set) Q16","single","1","A university is collaborating with several external research institutions to provide a shared research platform. The platform hosts sensitive data and requires secure access control. The university and each of the research institutions have their own identity management systems.
To facilitate secure and seamless access to the shared platform, the university proposes using federated identity management.
What is a critical consideration the university must address to ensure the success of this federated identity management implementation?","The university should centralize all user accounts into a single database managed by the university.","Each institution, including the university, should become a SAML Identity Provider (IdP), and the shared platform should act as a SAML Relying Party (RP).","The shared platform should be the sole Identity Provider (IdP), and all institutions must migrate their accounts to this platform.","All participating institutions should abandon their existing identity management systems in favor of a new, unified system.","","","","B","The correct answer is that each institution, including the university, should become a SAML Identity Provider (IdP), and the shared platform should act as a SAML Relying Party (RP). By each institution becoming a SAML Identity Provider (IdP) and the shared platform acting as a SAML Relying Party (RP), each institution can maintain control over its own user accounts and authentication processes. This approach allows users from each institution to access the shared platform using their existing credentials, ensuring secure and seamless access. It respects the autonomy of each institution's identity management system while facilitating interoperability through federated identity management.
Centralizing all user accounts into a single database managed by the university would be impractical and raise significant privacy and security concerns. It would also require extensive migration efforts.
Making the shared platform the sole Identity Provider (IdP) would force all institutions to migrate their accounts, which is logistically challenging and may not be acceptable to all institutions.
Abandoning existing identity management systems in favor of a new, unified system would be highly disruptive, costly, and likely meet resistance from institutions that have invested in their current systems."
"ex9-q17","Network Security","exam title in PDF","Exam Practice 4 (2nd set) Q17","single","1","Which of the following is a program that appears to be a legitimate application, utility, game, or screensaver but surreptitiously performs malicious activities?","Outlook Express","Worm","Rootkit","Trojan horse","","","","D","A Trojan horse is a program that appears to be a legitimate application, utility, game, or screensaver that surreptitiously performs malicious activities. Trojan horses are very common on the Internet. To keep your systems secure and free from such malicious code, you need to take extreme caution when downloading any type of file from just about any site on the internet. If you don't fully trust the site or service that is offering a file, don't download it.
Outlook Express is an email client found on Windows.
A worm is a type of malicious code whose primary purpose is to duplicate itself and spread but does not necessarily damage or destroy resources.
A rootkit is a set of programs that allow attackers to maintain permanent and hidden administrator-level access to a computer."
